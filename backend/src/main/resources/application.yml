server:
  port: 8080

spring:
  application:
    name: campus-food

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_food?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
#    url: jdbc:mysql://campusfood-mysql:3306/campus_food_db?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123666888

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

# 文件上传路径配置（根级别）
file:
  upload:
    path: ./uploads/

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: campus-food-secret-key-2024-hmac-sha256-algorithm-secure-jwt-key-256bits
  expiration: 2592000000  # 30天（毫秒）

# Knife4j配置
knife4j:
  enable: true
